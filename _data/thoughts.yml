- id: 2023-03-02-neural-network-solution-space
  date: '2023-03-02'
  content: |
    只要给神经网络无限大的解空间，模型就一定能够找到正确的答案，这个规律已经可以作为一个基础的定理了，就好比古猿人抬头仰望宇宙的那一刻，对于文明而言无穷大的解空间中才出现了正确答案，那什么时候可以计算出正确答案这件事在文明发展的刻度上就只是秒级的耗时了；这也解释了随着模型参数指数级上升，大模型表现出涌现的能力；在这个定理 & 大模型定理（类摩尔定律，每隔一定时间大模型训练成本指数级下降与模型性能指数级上升）两者相辅相成的情况下，我们 or 模型可以探索一切未知

