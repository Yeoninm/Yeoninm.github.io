- id: 2023-08-19-choosing-an-era
  date: '2023-08-19'
  content: |
    在看走向共和中梁启超劝李鸿章挥军北上，创君主立宪那一段时，对选择的力量有了一个新的理解。

    过去我们常说选择的力量是伟大的，但很难量化这个伟大的程度；选择的伟大时常会体现在相对微观的事情上，比如选择一个优秀的伴侣或者选择一个像过去20年互联网这样有潜力的行业，腾讯和阿里分别在98年99年成立，那时是互联网刚刚开始在中国兴起，无论是创始人还是早期员工全都收获了选择带给他们丰厚的果实，这确实是选择行业的力量；

    但实际上还有另一种选择更伟大，那就是选择时代（人是有机会选择自己所处的时代的）在剧中李鸿章回绝梁启超的理由是“一代人有一代人要做的事”，潜台词是他认为其他人可能是改变中国的一代人，但自己只能是帮着大清走下去的一代人，李鸿章的儒家思想导致了他早就没有改变历史进程的心力。

    如果把视线拉回到大清，李鸿章的成就应该是整个大清无人能及的，但是在后人的眼中李鸿章的成就完全不如梁启超这些他眼中的“后生”，他的问题其实是在有机会选择另一个时代的时候，做出了错误的选择，认为自己没有机会成为挽救中国的一代人，所以成了悲剧人物。

    对我们的警示是不能只把选择局限在行业，同伴等微观方面，时代的变革来临前，选择自己成为哪个时代的人更重要。

    那我们现在可能会处在什么样的时代变革，我觉得可能会有两种时代变革，其一是生产力变革，AI或者核聚变等技术带来的无尽生产力，其二是生产关系变革，这一点需要依赖前一个变革的完成，当通过技术创新获得无尽生产力之后，我们需要在当下糟糕的生产关系废墟上重造社会的生产关系，通过某种类似于全民基本工资的方式实现真正的人人平等。

