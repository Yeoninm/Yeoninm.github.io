- id: 2024-05-13-intuition
  date: '2024-05-13'
  content: |
    看人的时候可以相信第一直觉，第一直觉判断这个人是什么样的人，大概率就是什么样的人。

    从直觉可以准确判断人的原因是大部分人没有品德问题，产生矛盾的根本性在于每个人不同的逻辑思维，直觉是可以准确的判断一个人的逻辑思维能力的，如果直觉告诉你一个人的逻辑和条理和自己有很大的出入的话，大概率没办法和这个人长久共事；

    看事情的时候一定要质疑直觉，大概率这件事儿就不是第一直觉那样的。

    原因是相对于人而言事情的发展动态性更强，复杂性更高（人的复杂性无外乎人性，事情的复杂性多了一个时间维度）直觉没办法判断复杂性更高的事情
