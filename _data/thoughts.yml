  content: |
    偶遇了一家WeWork，才发现WeWork最近有点欣欣向荣的意思

    从传统的重资产租赁变成了协议式管理（WeWork 不再作为承租人，而是与业主签署合作协议。业主保留房产的经营权，WeWork 仅提供品牌授权、招租服务、空间设计、运营管理以及技术系统支持。 ）

    2025年财务健康显着提升，年营收39.8亿美元，营收可能低于租赁模式，但其毛利率更高且现金流更稳定，现在这个模式下破产肯定是破产不了了（不需要付租金，运营成本极低）

