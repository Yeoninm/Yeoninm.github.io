- id: 2022-03-08-aging
  date: '2022-03-08'
  content: |
    人类的平均寿命从1900年的32岁增长到如今的75岁，

    即使是攻克了所有癌症，人类的最大预期寿命应该也只能增加四到五年；攻克疾病只能延缓死亡，只是生物医学史上一个必须要走的歧路，解决衰老问题才是最重要范式，终止衰老背后可能会出现很多嘈杂的伦理问题，但是相对于最重要的那个问题，所有的噪音都会被一一解决的

