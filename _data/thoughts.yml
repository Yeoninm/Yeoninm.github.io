- id: 2022-09-29-trust-and-uncertainty
  date: '2022-09-29'
  content: |
    行为间的不确定性导致了“信任”这个概念的出现，以至于我们需要构建信任这个虚拟的“品质”，来忽视或者是忘记行为间的不确定性；比如部分人与人交易行为中，我们需要相信对方的可靠性，或者是我们要相信法律对对方约束的可靠性；但是却从根本上忘记了行为间的不确定性本质上是可以消除的，那某种意义上也就消除了人类社会中“信任”这个词语

