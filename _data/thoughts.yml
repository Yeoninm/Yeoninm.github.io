- id: 2025-05-20-team-resilience
  date: '2025-05-20'
  content: |
    Crypto 行业里，团队的韧性可能比初始产品形态更重要，比如 [pump.fun](https://t.co/EzRkX47sqF) 早期其实并不是做 launchpad，做的是 NFT marketplace😅，几次碰壁后才转向了现在的方向；

    好像任何一个早期的行业都是这样，快速试错与灵活转型构成的动态护城河，比静态的产品创意更具竞争力；

    Crypto 里试错机会太多了，团队的韧性加上一点点产品的审美，加上一点点的运气，可能就成了下一个新的独角兽

    团队持久作战能力×产品美学感知力×市场β机遇=潜在独角兽

    What is the next meta?

