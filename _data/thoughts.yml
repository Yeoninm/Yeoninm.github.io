- id: 2025-03-23-paradigm-matt-huang
  date: '2025-03-23'
  content: |
    Paradigm 的 Matt Huang 居然投过今日头条的天使轮，中文名黄共宇

    “公司创立半年左右，一个来北京旅游的美国创业者，经过朋友介绍来公司参观，聊了很多产品技术。他很惊讶，说这间公寓里团队的技术是跟硅谷接轨的，他能不能做一笔投资？后来他就成了我们的投资人。”张一鸣称

    有意思是，字节跳动与加密项目是存在一些共性的：都试图通过算法重构资源配置（信息流 vs 价值流），都需要处理大规模实时数据，且都面临中心化与去中心化的治理博弈。

    这就叫做范式转移的最佳猎手吧

    原文 [m.ikanchai.com/pcarticle/2760](https://t.co/gZBRVYcjyj)

