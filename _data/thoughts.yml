- id: 2025-02-13-contrarian
  date: '2025-02-13'
  content: |
    加密行业和 web2 行业有一个很有意思的相同点。

    加密行业里早期备受质疑的项目反而要比早期就得到大家认可的项目更容易成长起来，比如早期投资人对 Solana 的不屑一顾和围绕 Uniswap 的争议。

    web2 行业中如早期理想坚持做增程，做家庭细分赛道时投资人的不理解不支持；

    换而言之，如果你有一个创业的想法，这个想法得到大多数人认可的时候就是你要反思自己的时候，如果你对一个创业想法有着很清晰的逻辑，但是大多数人都反对都质疑，那这个想法就值得去实现；

    我理解这样的好处有两方面，一方面是能帮助你逃离内卷环境，另一方面是有机会解决大家没发现的问题；

    这应该就是 Peter Thiel 在《从零到一》 中反复提的“Contrarian”，在主流观点之外寻找新的机会和独特的见解。

