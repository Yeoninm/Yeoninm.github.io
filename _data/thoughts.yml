- id: 2025-09-02-li-auto
  date: '2025-09-02'
  content: |
    理想是新能源车企里最像苹果的一家公司，像苹果一样专注产品，也像苹果一样缺了一些攻击性

    问题在于苹果的极致护城河允许他们缺少攻击性，但新能源赛道不行

    这两年来理想在领先的山头上不断的迎来华为，零跑，小米，甚至现在的蔚来的进攻，当其他人都在学理想的时候，理想内部感受到的是骄傲，感受到的是对当时决策的正确的自豪，埋头继续在产品上试图革新，却没能意识到新能源的低护城河，产品上的革新很容易就被抄走

    如果加上一些攻击性，以攻代守，攻向其他山头，比如AI眼镜，强化车内体验的同时，眼镜作为一个潜在的流量入口，也多了些进攻点，情况会不会好一些

- id: 2025-08-30-energy-drinks
  date: '2025-08-30'
  content: |
    功能饮料行业是个有意思的行业，主要配料明确，就是牛磺酸和咖啡因，口味差异更是约等于无。

    但是却容纳了红牛，东鹏特饮，怪物饮料等等这么多的超高利润公司，可预见的未来里，这个行业还会越来越卷，毕竟门槛极低，利润极高，规模大小完全和配方无关，全看营销和渠道

    还有个有意思的发现，功能饮料的主要原料牛磺酸的百分之90产量出自中国，龙头是永安药业

