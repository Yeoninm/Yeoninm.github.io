- id: 2026-01-20-typeless
  date: '2026-01-20'
  content: |
    我一直觉得人机交互最大的瓶颈在于 IO 带宽，其中主要问题在于敲击文字的速度。

    人类大脑的思维是非线性的，语速能到 150wpm，但打字只有 50wpm 左右。这种低效的“线性化”过程不仅慢，还极其消耗 CPU（认知负载）。

    以前曾寄希望于语音输入，但苹果原生的 Dictation 懂“字”却不懂“意”：

    ❌ 满篇的口头禅（呃、然后）

    ❌ 识别不出技术术语

    ❌ 只要构思没跟上，转出来就是一堆垃圾

    今天试了 Typeless，才感觉语音输入真正成了生产力。它的底层逻辑不再是简单的 ASR，而是 AI 重构：

    自动去噪：过滤掉所有废话和语气词。

    逻辑纠偏：即使你说得断断续续，它也能输出逻辑严密的书面语。

    指令编辑：对着它说“把这段改得更专业点”，瞬间完成润色。

    从“人工录入”进化到“意图传输”，打字的时代可能真的要结束了。

